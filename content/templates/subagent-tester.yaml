id: subagent-tester
kind: subagent
title:
  vi: Subagent viết và chạy test
  en: Test-writing subagent
summary:
  vi: Subagent viết test cho phần code vừa đổi, chạy test và báo kết quả. Nó chỉ được sửa file test, không sửa code chính, để lỗi tìm ra vẫn do bạn hoặc Claude quyết định cách sửa.
  en: A subagent that writes tests for the code that just changed, runs them and reports. It only edits test files, never the code under test, so fixing what it finds stays your call.
docs: https://code.claude.com/docs/en/sub-agents
checked_with: "2.1.329"
