id: subagent-reviewer
kind: subagent
title:
  vi: Subagent review code
  en: Code review subagent
summary:
  vi: Subagent chỉ đọc, chuyên review thay đổi chưa commit và báo lỗi theo mức độ. Không có quyền sửa file, nên dùng an toàn sau mỗi lần Claude viết code xong.
  en: A read-only subagent that reviews uncommitted changes and reports problems by severity. It cannot edit files, so it is safe to run after Claude finishes writing code.
