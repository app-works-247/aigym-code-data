# CLI commands and flags: names and links from cli-reference in the official
# Claude Code docs; descriptions are our own words. Set reviewed: true after reading.
- id: cli-add-dir
  group: cli
  name: --add-dir
  syntax: --add-dir
  summary:
    vi: Cấp quyền đọc và chỉnh sửa tệp cho Claude trong các thư mục bổ sung.
    en: Grants Claude file read and write permissions in extra folders.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --add-dir ../apps ../lib
- id: cli-advisor
  group: cli
  name: --advisor
  syntax: --advisor <model>
  summary:
    vi: Bật công cụ advisor phía server cho session bằng alias hoặc ID model cụ thể.
    en: Activates the server advisor feature for the session using a chosen model alias or identifier.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --advisor opus
- id: cli-agent
  group: cli
  name: --agent
  syntax: --agent
  summary:
    vi: Chỉ định một agent cụ thể áp dụng cho session hiện tại.
    en: Selects a specific agent implementation for the current session.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --agent my-custom-agent
- id: cli-agents
  group: cli
  name: --agents
  syntax: --agents
  summary:
    vi: Khai báo động các subagent tùy chỉnh thông qua chuỗi JSON hoặc đường dẫn tệp JSON.
    en: Passes custom subagent specifications dynamically using raw JSON or a JSON file path.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --agents '{"reviewer":{"description":"Reviews code","prompt":"You are a code reviewer"}}'
- id: cli-allow-dangerously-skip-permissions
  group: cli
  name: --allow-dangerously-skip-permissions
  syntax: --allow-dangerously-skip-permissions
  summary:
    vi: Cho phép thêm bypassPermissions vào vòng lặp chuyển chế độ khi nhấn Shift+Tab.
    en: Permits cycling into the bypassPermissions option during Shift+Tab mode changes.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --permission-mode default --allow-dangerously-skip-permissions
- id: cli-allowedtools
  group: cli
  name: --allowedTools
  syntax: --allowedTools
  summary:
    vi: Chỉ định danh sách công cụ được phép chạy tự động mà không cần hỏi quyền.
    en: Specifies tools that can run automatically without prompting for authorization.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: '"Bash(git log *)" "Bash(git diff *)" "Read"'
- id: cli-append-subagent-system-prompt
  group: cli
  name: --append-subagent-system-prompt
  syntax: --append-subagent-system-prompt
  summary:
    vi: Nối thêm nội dung vào cuối system prompt của mọi subagent khi chạy không tương tác.
    en: Adds extra instructions to the end of system prompts across all subagents in non-interactive runs.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --append-subagent-system-prompt "Cite file paths in every answer" "query"
- id: cli-append-subagent-system-prompt-file
  group: cli
  name: --append-subagent-system-prompt-file
  syntax: --append-subagent-system-prompt-file
  summary:
    vi: Đọc nội dung từ tệp để nối vào cuối system prompt của subagent khi chạy không tương tác.
    en: Reads text from a file to append to subagent system prompts during non-interactive runs.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --append-subagent-system-prompt-file ./subagent-rules.txt "query"
- id: cli-append-system-prompt
  group: cli
  name: --append-system-prompt
  syntax: --append-system-prompt
  summary:
    vi: Nối thêm nội dung tùy chỉnh vào phần cuối của system prompt mặc định.
    en: Adds user-defined instructions to the conclusion of the standard system prompt.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --append-system-prompt "Always use TypeScript"
- id: cli-append-system-prompt-file
  group: cli
  name: --append-system-prompt-file
  syntax: --append-system-prompt-file
  summary:
    vi: Tải nội dung từ tệp để nối thêm vào cuối system prompt mặc định.
    en: Loads a file to attach its contents to the default system prompt.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --append-system-prompt-file ./extra-rules.txt
- id: cli-autocompact
  group: cli
  name: --autocompact
  syntax: --autocompact <auto|tokens>
  summary:
    vi: Thiết lập ngưỡng auto-compact cho session hiện tại mà không sửa cấu hình đã lưu.
    en: Configures the auto-compact threshold for the active session without altering stored settings.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --autocompact 500k
- id: cli-ax-screen-reader
  group: cli
  name: --ax-screen-reader
  syntax: --ax-screen-reader
  summary:
    vi: Định dạng đầu ra dạng văn bản phẳng không trang trí để hỗ trợ screen reader.
    en: Switches output to plain text without decorative formatting to aid screen reader software.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --ax-screen-reader
- id: cli-bare
  group: cli
  name: --bare
  syntax: --bare
  summary:
    vi: Tắt tự nhận diện hook, skill, plugin và MCP server để khởi động nhanh hơn.
    en: Disables loading project configuration, hooks, plugins, and MCP servers for faster startup.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --bare -p "query"
- id: cli-betas
  group: cli
  name: --betas
  syntax: --betas
  summary:
    vi: Bổ sung các header beta vào yêu cầu API khi dùng API key.
    en: Includes custom beta feature headers when dispatching API calls.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --betas interleaved-thinking
- id: cli-bg
  group: cli
  name: --bg
  syntax: --bg
  summary:
    vi: Khởi tạo session chạy ngầm và trả về quyền điều khiển ngay lập tức.
    en: Spawns the agent as a background task and immediately returns control to the shell.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --bg "investigate the flaky test"
- id: cli-channels
  group: cli
  name: --channels
  syntax: --channels
  summary:
    vi: Lắng nghe thông báo kênh của MCP server từ các plugin được chỉ định trong session.
    en: Listens for MCP server channel notifications from specified plugins during the session.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --channels plugin:my-notifier@my-marketplace
- id: cli-chrome
  group: cli
  name: --chrome
  syntax: --chrome
  summary:
    vi: Bật tích hợp trình duyệt Chrome để tự động hóa và kiểm thử web.
    en: Turns on Chrome integration to perform automated web actions and tests.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --chrome
- id: cli-cloud
  group: cli
  name: --cloud
  syntax: --cloud
  summary:
    vi: Tạo session cloud mới với mô tả tác vụ hoặc xếp hàng tin nhắn vào session có sẵn.
    en: Starts a new cloud session with a prompt or pushes a message to an existing session.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --cloud "Fix the login bug"
- id: cli-continue
  group: cli
  name: --continue
  syntax: --continue
  summary:
    vi: Khôi phục cuộc hội thoại gần nhất trong thư mục hiện tại.
    en: Restores the latest conversation found in the current working directory.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --continue
- id: cli-correlation-id
  group: cli
  name: --correlation-id
  syntax: --correlation-id <id>
  summary:
    vi: Truyền mã định danh tới hook spawn-runner khi dùng cùng tùy chọn --environment.
    en: Provides an identifier to the spawn-runner hook alongside the environment option.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p "Run the build" --environment ccpool_abc123 --correlation-id build-4821
- id: cli-dangerously-load-development-channels
  group: cli
  name: --dangerously-load-development-channels
  syntax: --dangerously-load-development-channels
  summary:
    vi: Cho phép dùng các kênh chưa được phê duyệt để phát triển local sau khi xác nhận.
    en: Permits unapproved channels for local development after interactive confirmation.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --dangerously-load-development-channels server:webhook
- id: cli-dangerously-skip-permissions
  group: cli
  name: --dangerously-skip-permissions
  syntax: --dangerously-skip-permissions
  summary:
    vi: Bỏ qua các yêu cầu xin quyền xác nhận trong suốt session.
    en: Bypasses all permission confirmations throughout the session.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --dangerously-skip-permissions
- id: cli-debug
  group: cli
  name: --debug
  syntax: --debug
  summary:
    vi: Kích hoạt chế độ debug với tùy chọn lọc danh mục cần xem hoặc loại trừ.
    en: Activates debugging output with optional category inclusions or exclusions.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --debug='mcp,startup'
- id: cli-debug-file
  group: cli
  name: --debug-file
  syntax: --debug-file <path>
  summary:
    vi: Ghi log debug vào đường dẫn tệp chỉ định và tự động bật chế độ debug.
    en: Directs debug output to a designated file and turns on debug mode.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --debug-file /tmp/claude-debug.log
- id: cli-desktop
  group: cli
  name: --desktop
  syntax: --desktop
  summary:
    vi: Mở ứng dụng Claude Desktop tại thư mục hiện tại mà không chạy trong terminal.
    en: Launches the Claude Desktop application in this directory without running in terminal.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --desktop
- id: cli-disable-slash-commands
  group: cli
  name: --disable-slash-commands
  syntax: --disable-slash-commands
  summary:
    vi: Vô hiệu hóa toàn bộ skill và lệnh cho session này.
    en: Deactivates all skills and slash commands for the active session.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --disable-slash-commands
- id: cli-disallowedtools
  group: cli
  name: --disallowedTools
  syntax: --disallowedTools
  summary:
    vi: Thiết lập quy tắc chặn bằng cách ẩn công cụ hoặc ngăn các lệnh gọi khớp mẫu.
    en: Sets tool restriction rules by hiding tools or blocking specific invocations.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: '"Bash(git log *)" "Bash(git diff *)" "Edit"'
- id: cli-effort
  group: cli
  name: --effort
  syntax: --effort
  summary:
    vi: Đặt mức độ effort suy nghĩ cho model của cuộc hội thoại chính.
    en: Specifies the reasoning effort level applied to the primary conversation model.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --effort high
- id: cli-enable-auto-mode
  group: cli
  name: --enable-auto-mode
  syntax: --enable-auto-mode
  summary:
    vi: Đánh dấu cờ cũ đã bị gỡ bỏ và được thay thế bằng permission mode auto.
    en: Indicates an obsolete flag replaced by auto permission mode.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --permission-mode auto
- id: cli-environment
  group: cli
  name: --environment
  syntax: --environment <environment-id>
  summary:
    vi: Khởi tạo session cloud chạy trên môi trường tự host với ID chỉ định.
    en: Initializes a cloud session targeting the designated self-hosted runner pool.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p "Fix the login bug" --environment ccpool_abc123
- id: cli-exclude-dynamic-system-prompt-sections
  group: cli
  name: --exclude-dynamic-system-prompt-sections
  syntax: --exclude-dynamic-system-prompt-sections
  summary:
    vi: Chuyển context người dùng sang prompt đầu tiên để tăng hiệu quả cache prompt.
    en: Shifts per-user context to the initial user prompt to improve prompt caching.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --exclude-dynamic-system-prompt-sections "query"
- id: cli-exec
  group: cli
  name: --exec
  syntax: --exec
  summary:
    vi: Chạy lệnh shell dưới dạng tiến trình PTY nền thay vì mở session Claude.
    en: Executes a shell command as a background PTY process instead of running Claude.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --bg --exec 'pytest -x'
- id: cli-fallback-model
  group: cli
  name: --fallback-model
  syntax: --fallback-model
  summary:
    vi: Thiết lập danh sách model dự phòng theo thứ tự khi model chính bị quá tải.
    en: Configures ordered alternative models to handle outages of the primary model.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --fallback-model sonnet,haiku
- id: cli-fork-session
  group: cli
  name: --fork-session
  syntax: --fork-session
  summary:
    vi: Tạo ID session mới khi tiếp tục lại một cuộc trò chuyện thay vì dùng ID cũ.
    en: Generates a fresh session ID when reopening an existing conversation.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --resume abc123 --fork-session
- id: cli-forward-subagent-text
  group: cli
  name: --forward-subagent-text
  syntax: --forward-subagent-text
  summary:
    vi: Truyền các khối văn bản và suy nghĩ của subagent vào luồng output.
    en: Streams text and reasoning outputs from subagents into the main stream.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --output-format stream-json --verbose --forward-subagent-text "query"
- id: cli-from-pr
  group: cli
  name: --from-pr
  syntax: --from-pr
  summary:
    vi: Lọc danh sách chọn session theo các cuộc hội thoại gắn với pull request chỉ định.
    en: Filters the session selector to conversations linked with a given pull request.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --from-pr 123
- id: cli-ide
  group: cli
  name: --ide
  syntax: --ide
  summary:
    vi: Tự động kết nối với IDE khi khởi động nếu chỉ có đúng một IDE hợp lệ.
    en: Connects automatically to the IDE when a single valid instance is present.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --ide
- id: cli-include-hook-events
  group: cli
  name: --include-hook-events
  syntax: --include-hook-events
  summary:
    vi: Bổ sung các sự kiện vòng đời của hook vào luồng dữ liệu stream-json.
    en: Streams hook lifecycle progress and responses in JSON streaming output.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --output-format stream-json --verbose --include-hook-events "query"
- id: cli-include-partial-messages
  group: cli
  name: --include-partial-messages
  syntax: --include-partial-messages
  summary:
    vi: Bao gồm các sự kiện streaming từng phần ở đầu ra khi dùng print mode với stream-json.
    en: Outputs streaming events incrementally when running in print mode with stream-json output.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --output-format stream-json --verbose --include-partial-messages "query"
- id: cli-init
  group: cli
  name: --init
  syntax: --init
  summary:
    vi: Chạy các hook Setup có matcher init trước session trong chế độ print.
    en: Triggers init Setup hooks prior to starting the session in print mode.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --init "query"
- id: cli-init-only
  group: cli
  name: --init-only
  syntax: --init-only
  summary:
    vi: Chạy các hook Setup và SessionStart rồi thoát mà không mở hội thoại.
    en: Executes Setup and SessionStart hooks then immediately exits.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --init-only
- id: cli-input-format
  group: cli
  name: --input-format
  syntax: --input-format
  summary:
    vi: Chọn định dạng đầu vào cho print mode giữa text và stream-json.
    en: Chooses the input format for print mode between text and stream-json.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --input-format stream-json --output-format stream-json --verbose
- id: cli-json-schema
  group: cli
  name: --json-schema
  syntax: --json-schema
  summary:
    vi: Xác thực đầu ra JSON khớp với một JSON Schema sau khi hoàn thành quy trình trong print mode.
    en: Enforces output validation against a specified JSON Schema once agent execution finishes in print
      mode.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --json-schema '{"type":"object","properties":{...}}' "query"
- id: cli-maintenance
  group: cli
  name: --maintenance
  syntax: --maintenance
  summary:
    vi: Chạy Setup hook có bộ khớp maintenance trước khi bắt đầu session trong print mode.
    en: Triggers Setup hooks configured with the maintenance matcher prior to starting a print mode session.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --maintenance "query"
- id: cli-max-budget-usd
  group: cli
  name: --max-budget-usd
  syntax: --max-budget-usd
  summary:
    vi: Dừng chạy print mode khi ước tính chi phí API đạt mức ngân sách chỉ định.
    en: Halts print mode execution when client-side estimated API expenses reach the given dollar threshold.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --max-budget-usd 5.00 "query"
- id: cli-max-turns
  group: cli
  name: --max-turns
  syntax: --max-turns
  summary:
    vi: Giới hạn số lượt tương tác của agent trong print mode.
    en: Restricts the total number of agent interaction turns allowed in print mode.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude -p --max-turns 3 "query"
- id: cli-mcp-config
  group: cli
  name: --mcp-config
  syntax: --mcp-config
  summary:
    vi: Tải các MCP server từ file JSON hoặc chuỗi JSON được chỉ định.
    en: Loads MCP servers from provided JSON configuration files or raw JSON strings.
  docs: https://code.claude.com/docs/en/cli-reference
  verified_at: '2026-11-20'
  reviewed: false
  example: claude --mcp-config ./mcp.json
- id: cli-metadata
  group: cli
  name: --metadata
  syntax: --metadata <key=value>
  summary:
    vi: Gán nhãn key-value cho session mới khi dùng với --environment để khớp với hook-label.
    en: Applies key-value metadata tags to an environment-based session for matching orchestrator hook
