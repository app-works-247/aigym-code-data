# Hook events: names and links from hooks in the official
# Claude Code docs; descriptions are our own words. Set reviewed: true after reading.
- id: hooks-configchange
  group: hooks
  name: ConfigChange
  syntax: ConfigChange
  summary:
    vi: Chạy mỗi khi có tệp cấu hình bị thay đổi trong suốt session.
    en: Executes whenever any configuration file gets modified in the middle of a session.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: bd315308cada
- id: hooks-cwdchanged
  group: hooks
  name: CwdChanged
  syntax: CwdChanged
  summary:
    vi: Chạy khi thư mục làm việc thay đổi, ví dụ qua lệnh cd, hỗ trợ quản trị môi trường với các công
      cụ như direnv.
    en: Triggers whenever the working directory changes, such as after executing a cd command, aiding
      tools like direnv.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 973070e44a08
- id: hooks-directoryadded
  group: hooks
  name: DirectoryAdded
  syntax: DirectoryAdded
  summary:
    vi: Chạy khi thêm thư mục làm việc giữa session qua /add-dir hoặc yêu cầu điều khiển register_repo_root
      của SDK.
    en: Triggers upon adding a working directory mid-session with /add-dir or the register_repo_root SDK
      control request.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 5ee1f5c04255
- id: hooks-elicitation
  group: hooks
  name: Elicitation
  syntax: Elicitation
  summary:
    vi: Chạy khi một MCP server yêu cầu người dùng nhập liệu trong một tool call.
    en: Triggers when an MCP server asks for user input during a tool call.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: a54b2f8afdf1
- id: hooks-elicitationresult
  group: hooks
  name: ElicitationResult
  syntax: ElicitationResult
  summary:
    vi: Chạy sau khi người dùng phản hồi MCP elicitation và trước lúc gửi lại server.
    en: Fires after the user answers an MCP elicitation and before returning the response to the server.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 0cc378420154
- id: hooks-filechanged
  group: hooks
  name: FileChanged
  syntax: FileChanged
  summary:
    vi: Chạy khi tệp đang theo dõi bị thay đổi trên đĩa, sử dụng trường matcher để lọc tên tệp.
    en: Fires when a monitored file updates on disk, using the matcher field to define targeted file names.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 322ac00d9cc1
- id: hooks-instructionsloaded
  group: hooks
  name: InstructionsLoaded
  syntax: InstructionsLoaded
  summary:
    vi: Chạy khi nạp các tệp CLAUDE.md hoặc .claude/rules/*.md vào context lúc khởi động hoặc nạp động
      trong session.
    en: Runs upon loading CLAUDE.md or .claude/rules/*.md files at startup or lazily during a session.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 7c187efad2ad
- id: hooks-messagedisplay
  group: hooks
  name: MessageDisplay
  syntax: MessageDisplay
  summary:
    vi: Chạy trong lúc nội dung tin nhắn của assistant đang được hiển thị.
    en: Executes while the assistant message text is being rendered on screen.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 94635c85b438
- id: hooks-notification
  group: hooks
  name: Notification
  syntax: Notification
  summary:
    vi: Chạy mỗi khi Claude Code phát ra một thông báo.
    en: Fires whenever Claude Code emits an alert or message.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: fe3835d9b45b
- id: hooks-permissiondenied
  group: hooks
  name: PermissionDenied
  syntax: PermissionDenied
  summary:
    vi: Chạy khi auto mode từ chối gọi tool, cho phép thử lại qua hookSpecificOutput.retry nếu classifier
      có kết luận.
    en: Fires when auto mode rejects a tool call, allowing retry requests via hookSpecificOutput.retry
      when a classifier verdict exists.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 82c5324fd0d3
- id: hooks-permissionrequest
  group: hooks
  name: PermissionRequest
  syntax: PermissionRequest
  summary:
    vi: Chạy khi một lượt gọi tool cần đưa ra quyết định cấp quyền.
    en: Triggers when an invoked tool requires an approval decision.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: e8329ac6e521
- id: hooks-postcompact
  group: hooks
  name: PostCompact
  syntax: PostCompact
  summary:
    vi: Chạy sau khi quá trình nén context hoàn tất.
    en: Executes after context compaction finishes.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 89d79ee01220
- id: hooks-postmodelswitch
  group: hooks
  name: PostModelSwitch
  syntax: PostModelSwitch
  summary:
    vi: Chạy sau khi model của session thay đổi, gồm cả lúc Claude Code tự khôi phục khi tiếp tục session.
    en: Fires after the session model changes, including automatic adjustments like restoring a model
      on resume.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 7872d1001c01
- id: hooks-posttoolbatch
  group: hooks
  name: PostToolBatch
  syntax: PostToolBatch
  summary:
    vi: Chạy khi toàn bộ một đợt gọi tool song song hoàn tất, trước lượt gọi model tiếp theo.
    en: Runs after an entire batch of parallel tool calls completes and before invoking the next model
      call.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 820cdb03eebf
- id: hooks-posttooluse
  group: hooks
  name: PostToolUse
  syntax: PostToolUse
  summary:
    vi: Chạy ngay sau khi một lệnh gọi tool kết thúc thành công.
    en: Fires right after a tool call completes successfully.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 8f5e8721aaed
- id: hooks-posttoolusefailure
  group: hooks
  name: PostToolUseFailure
  syntax: PostToolUseFailure
  summary:
    vi: Chạy ngay sau khi một lượt gọi tool gặp lỗi.
    en: Triggers right after a tool call encounters an error.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 320cb01cbfea
- id: hooks-precompact
  group: hooks
  name: PreCompact
  syntax: PreCompact
  summary:
    vi: Chạy trước khi quá trình nén context diễn ra.
    en: Executes before context compaction starts.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: a77f287c55e3
- id: hooks-premodelswitch
  group: hooks
  name: PreModelSwitch
  syntax: PreModelSwitch
  summary:
    vi: Chạy trước khi thực hiện chuyển đổi model được yêu cầu và có thể chặn việc này.
    en: Runs before applying a requested model change and can prevent the switch.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 7024d2775636
- id: hooks-pretooluse
  group: hooks
  name: PreToolUse
  syntax: PreToolUse
  summary:
    vi: Chạy trước khi một lệnh gọi tool thực thi và có thể chặn lệnh đó.
    en: Triggers prior to running a tool call and can prevent its execution.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 1d7807c79da0
- id: hooks-sessionend
  group: hooks
  name: SessionEnd
  syntax: SessionEnd
  summary:
    vi: Chạy khi một session kết thúc.
    en: Fires when a session finishes.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: ebac53493c40
- id: hooks-sessionstart
  group: hooks
  name: SessionStart
  syntax: SessionStart
  summary:
    vi: Chạy khi bắt đầu một session mới hoặc tiếp tục lại session cũ.
    en: Runs when starting a brand new session or resuming an existing one.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 538e258f1f54
- id: hooks-setup
  group: hooks
  name: Setup
  syntax: Setup
  summary:
    vi: Chạy một lần để chuẩn bị môi trường khi khởi động bằng --init-only, hoặc --init/--maintenance
      cùng -p (hợp với CI).
    en: Fires once for preparation work when Claude Code starts with --init-only, or --init/--maintenance
      in -p mode, e.g. in CI.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 2e12ed8f3479
- id: hooks-stop
  group: hooks
  name: Stop
  syntax: Stop
  summary:
    vi: Chạy khi Claude đã hoàn tất câu trả lời của mình.
    en: Triggers once Claude has completed generating its full response.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 923b7a47dea3
- id: hooks-stopfailure
  group: hooks
  name: StopFailure
  syntax: StopFailure
  summary:
    vi: Chạy khi lượt tương tác kết thúc do gặp lỗi API.
    en: Fires when an ongoing turn stops abruptly due to an API error.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 516c99dc8441
- id: hooks-subagentstart
  group: hooks
  name: SubagentStart
  syntax: SubagentStart
  summary:
    vi: Chạy khi một subagent mới được sinh ra và bắt đầu hoạt động.
    en: Triggers whenever a new subagent is created and started.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: e445d5b61a1f
- id: hooks-subagentstop
  group: hooks
  name: SubagentStop
  syntax: SubagentStop
  summary:
    vi: Chạy khi một subagent kết thúc quá trình làm việc.
    en: Triggers when an active subagent concludes its execution.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 8927a03a126a
- id: hooks-taskcompleted
  group: hooks
  name: TaskCompleted
  syntax: TaskCompleted
  summary:
    vi: Chạy trong lúc một task đang được đánh dấu là hoàn thành.
    en: Executes while a task is being updated to completed status.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 7960c2cc2238
- id: hooks-taskcreated
  group: hooks
  name: TaskCreated
  syntax: TaskCreated
  summary:
    vi: Chạy trong lúc một task đang được tạo qua TaskCreate.
    en: Fires while a task is being generated through TaskCreate.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: f288d7d61579
- id: hooks-teammateidle
  group: hooks
  name: TeammateIdle
  syntax: TeammateIdle
  summary:
    vi: Chạy ngay trước khi một thành viên trong nhóm agent chuyển sang trạng thái nhàn rỗi.
    en: Runs right before an agent team teammate enters an idle state.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 91450dab7223
- id: hooks-userpromptexpansion
  group: hooks
  name: UserPromptExpansion
  syntax: UserPromptExpansion
  summary:
    vi: Chạy khi một lệnh bạn gõ được mở rộng thành prompt, trước khi gửi cho Claude; có thể chặn việc
      mở rộng đó.
    en: Fires when a command you type is turned into a full prompt, before Claude sees it; it can stop
      that from happening.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 64cb6b5a47ad
- id: hooks-userpromptsubmit
  group: hooks
  name: UserPromptSubmit
  syntax: UserPromptSubmit
  summary:
    vi: Chạy trước khi Claude xử lý prompt gửi lên, bao gồm cả các lượt do Claude Code tự khởi xướng.
    en: Fires prior to Claude handling a submitted prompt, including turns initiated automatically by
      Claude Code.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: ea446aacb71e
- id: hooks-worktreecreate
  group: hooks
  name: WorktreeCreate
  syntax: WorktreeCreate
  summary:
    vi: 'Chạy khi cần tạo worktree (--worktree, isolation: "worktree", session nền) và thay cách git tạo
      mặc định.'
    en: 'Fires when a worktree is needed (--worktree, isolation: "worktree", background sessions) and
      replaces git''s own step.'
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: 5212e492501f
- id: hooks-worktreeremove
  group: hooks
  name: WorktreeRemove
  syntax: WorktreeRemove
  summary:
    vi: Chạy khi xóa một worktree đã được tạo bởi hook WorktreeCreate.
    en: Runs when deleting a worktree generated by a WorktreeCreate hook.
  docs: https://code.claude.com/docs/en/hooks
  verified_at: '2026-11-20'
  reviewed: false
  docs_hash: ed85838bb553
