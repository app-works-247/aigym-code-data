name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the migration test; nothing here touches Neon.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aigym_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aigym_test
        run: python -m unittest discover -s tests -v
      - name: Check seeds and migrations
        run: python -m pipeline seeds-check && python -m pipeline migrate --check
      - name: Status function tests
        run: node --test functions/status.test.mjs
      - name: Scheduler Worker tests
        run: node --test scheduler/index.test.mjs
      - name: Smoke test CLI
        run: python -m pipeline --version
