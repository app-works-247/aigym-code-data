name: weekly

# docs/database.md section 6, layer 2: an encrypted pg_dump every week, kept 90 days as a
# workflow artifact. This repo is public, so the artifact is encrypted (scripts/backup.sh) with
# BACKUP_PASSPHRASE, which lives only in GitHub Secrets and with the owner. Restore with
# scripts/restore.sh into a new Neon branch, never into the live database.
on:
  # Started on time by the Cloudflare Worker in scheduler/ (GitHub's own schedule ran late or
  # not at all). The time lives in scheduler/wrangler.toml; this file only allows the dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres 18 client
        # pg_dump must be at least as new as the server (Neon: Postgres 18).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Dump, encrypt and read back
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          pg_dump --version
          scripts/backup.sh "aigym-code-$(date -u +%F).dump.enc"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: aigym-code-*.dump.enc
          retention-days: 90
          if-no-files-found: error
